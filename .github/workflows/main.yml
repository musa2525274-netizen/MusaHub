name: Build Musa Hub IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: MusaHub

          https://chatgpt.com/c/6abbc0db-cb7c-83ed-9ec8-c5bfba50c687#:~:text=YAML-,options%3A%0A%20%20bundleIdPrefix%3A%20com.musa%0A%20%20xcodeVersion%3A%20%2215.4%22%0A%20%20projectFormat%3A%20xcode15_3%0A%20%20deploymentTarget%3A%0A%20%20%20%20iOS%3A%20%2217.0%22,-Yani%20ilgili%20b%C3%B6l%C3%BCm%C3%BCn

          settings:
            base:
              SWIFT_VERSION: 5.0
              DEVELOPMENT_TEAM: ""

          targets:
            MusaHub:
              type: application
              platform: iOS
              sources:
                - MusaHubApp.swift
                - ContentView.swift
                - ScreenRecorderView.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.musa.musahub
                  INFOPLIST_KEY_CFBundleDisplayName: Musa Hub
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: 5.0
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

          xcodegen generate

      - name: Build iOS app
        run: |
          rm -rf "$RUNNER_TEMP/build"

          xcodebuild \
            -project MusaHub.xcodeproj \
            -scheme MusaHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$RUNNER_TEMP/build/MusaHub.app" \
            "$RUNNER_TEMP/Payload/MusaHub.app"

          cd "$RUNNER_TEMP"

          zip -r MusaHub.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusaHub-IPA
          path: ${{ runner.temp }}/MusaHub.ipa
          if-no-files-found: error
