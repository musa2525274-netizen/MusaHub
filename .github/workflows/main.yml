name: Build Musa Hub IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = """name: MusaHub

          options:
            bundleIdPrefix: com.musa
            projectFormat: xcode15_3
            deploymentTarget:
              iOS: "17.0"

          settings:
            base:
              SWIFT_VERSION: "5.0"

          targets:
            MusaHub:
              type: application
              platform: iOS
              sources:
                - MusaHubApp.swift
                - ContentView.swift
                - ScreenRecorderView.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.musa.musahub
                  INFOPLIST_KEY_CFBundleDisplayName: Musa Hub
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          """

          Path("project.yml").write_text(project.lstrip(), encoding="utf-8")
          PY

          cat project.yml
          xcodegen generate

      - name: Build iOS app
        run: |
          rm -rf "$RUNNER_TEMP/build"

          xcodebuild \
            -project MusaHub.xcodeproj \
            -scheme MusaHub \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$RUNNER_TEMP/build/MusaHub.app" \
            "$RUNNER_TEMP/Payload/MusaHub.app"

          cd "$RUNNER_TEMP"
          zip -r MusaHub.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusaHub-IPA
          path: ${{ runner.temp }}/MusaHub.ipa
